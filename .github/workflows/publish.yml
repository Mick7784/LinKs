name: Build and publish Docker image
on:
  push:
    branches: [main, feature/offer-card-two-steps]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      official_release:
        description: Publish an official numbered release
        type: boolean
        default: false
      version:
        description: Optional explicit version (otherwise increment VERSION)
        type: string
        default: ""
      validation_only:
        description: Run checks without publishing an image
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Story journey on desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/story-browser" playwright
          "$RUNNER_TEMP/story-browser/node_modules/.bin/playwright" install --with-deps chromium
          python3 scripts/analytics_test.py
          python3 scripts/instance_test.py
          node --test scripts/metrics.test.cjs scripts/dates.test.cjs scripts/video-api.test.mjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/instance-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/story-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/admin-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/public-browser-test.cjs
      - name: Build and smoke-test
        shell: bash
        run: |
          set -euo pipefail
          docker build -t links-test .
          docker run -d --name links-test --read-only --tmpfs /data:rw,nosuid,size=32m,mode=1777 --tmpfs /tmp:rw,noexec,nosuid,size=32m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:18080:8080 -p 127.0.0.1:18081:8081 links-test
          trap 'docker logs links-test; docker rm -f links-test' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          python3 scripts/smoke.py http://127.0.0.1:18080 http://127.0.0.1:18081 "$(docker exec links-test cat /data/setup-code)"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/stats)" = 404
          for file in style.css icons.css config.js app.js metrics.js assets/link-shopping.webp; do
            curl -fsS "http://127.0.0.1:18080/$file" -o /dev/null
          done
      - name: Choose official release version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.validation_only != true
        id: release
        env:
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
          OFFICIAL_RELEASE: ${{ inputs.official_release }}
          RELEASE_OVERRIDE: ${{ inputs.version }}
        run: python3 scripts/release-version.py
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.validation_only != true
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Publish AMD64 and ARM64 images
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.validation_only != true
        env:
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx create --use --name links-builder
          release_args=()
          if [ -n "$RELEASE_VERSION" ]; then
            if docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Release tag already exists; pull it before creating another release."
              exit 1
            fi
            release_args=(--tag "$IMAGE:$RELEASE_TAG" --build-arg "APP_RELEASE_VERSION=$RELEASE_VERSION" --build-arg "APP_RELEASE_ID=$RELEASE_VERSION:$COMMIT_SHA" --label "org.opencontainers.image.version=$RELEASE_VERSION")
          fi
          docker buildx build --platform linux/amd64,linux/arm64 --tag "$IMAGE:latest" --tag "$IMAGE:sha-$COMMIT_SHA" --label "org.opencontainers.image.revision=$COMMIT_SHA" "${release_args[@]}" --push .



