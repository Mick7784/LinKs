name: Build and publish Docker image
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      official_release:
        description: Publish an official numbered release
        type: boolean
        default: true
      version:
        description: Optional explicit version (otherwise increment VERSION)
        type: string
        default: ""
      validation_only:
        description: Run checks without publishing an image
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Story journey on desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/story-browser" playwright
          "$RUNNER_TEMP/story-browser/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m pip install Pillow
          python3 scripts/storage_test.py
          python3 scripts/images_test.py
          python3 scripts/analytics_test.py
          python3 scripts/pulse_bridge_test.py
          python3 scripts/affiliate_partners_test.py
          python3 scripts/tracked_duplicates_test.py
          python3 scripts/platform_sources_test.py
          python3 scripts/conservation_test.py
          python3 scripts/instance_test.py
          python3 scripts/release_version_test.py
          python3 scripts/youtube_test.py
          python3 scripts/themes_test.py
          python3 scripts/release_notes_test.py
          node --test scripts/metrics.test.cjs scripts/dates.test.cjs scripts/video-api.test.mjs scripts/calendar.test.cjs scripts/collection.test.cjs scripts/statistics-charts.test.cjs scripts/partner-report.test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/statistics-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/instance-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/story-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/admin-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/admin-ui-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/tracked-library-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/affiliate-partners-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/affiliate-detection-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/tracked-duplicates-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/platform-sources-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/calendar-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/settings-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/targeted-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/public-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/appearance-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/shortcuts-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/audit-fixes-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/optimization-browser-test.cjs
          NODE_PATH="$RUNNER_TEMP/story-browser/node_modules" node scripts/conservation-browser-test.cjs
      - name: Build and smoke-test
        shell: bash
        run: |
          set -euo pipefail
          docker build -t links-test .
          docker run -d --name links-test --read-only --tmpfs /data:rw,nosuid,size=32m,mode=1777 --tmpfs /tmp:rw,noexec,nosuid,size=32m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:18080:8080 -p 127.0.0.1:18081:8081 links-test
          trap 'docker logs links-test; docker rm -f links-test' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          python3 scripts/smoke.py http://127.0.0.1:18080 http://127.0.0.1:18081 "$(docker exec links-test cat /data/setup-code)"
          # Nginx alone must never mask a database failure.
          docker exec links-test python3 -c "import sqlite3; db=sqlite3.connect('/data/analytics.db'); db.execute('ALTER TABLE counts RENAME TO healthcheck_counts'); db.commit(); db.close()"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/healthz)" = 503
          docker exec links-test python3 -c "import sqlite3; db=sqlite3.connect('/data/analytics.db'); db.execute('ALTER TABLE healthcheck_counts RENAME TO counts'); db.commit(); db.close()"
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/nginx-healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/stats)" = 404
          for file in style.css icons.css config.js cards.js app.js metrics.js theme.js theme.css theme-tokens.json asset-library.json assets/link-shopping.webp assets/background-network.svg assets/photo-community.webp assets/photo-creator.webp assets/photo-technology.webp assets/photo-shopping.webp assets/photo-professional.webp assets/photo-lifestyle.webp; do
            curl -fsS "http://127.0.0.1:18080/$file" -o /dev/null
          done
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v3
      - name: Set up multiarchitecture builder
        uses: docker/setup-buildx-action@v3
      - name: Validate disposable AMD64 and ARM64 images
        run: bash scripts/check-images.sh "$(cat VERSION)" "$GITHUB_SHA"
      - name: Reserve persistent production version
        if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.official_release == true && inputs.validation_only == false) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release V')))
        id: release
        env:
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
          OFFICIAL_RELEASE: ${{ inputs.official_release }}
          RELEASE_OVERRIDE: ${{ inputs.version }}
        run: python3 scripts/release-version.py
      - name: Log in to GHCR
        if: steps.release.outputs.eligible == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Publish AMD64 and ARM64 images
        if: steps.release.outputs.eligible == 'true'
        env:
          COMMIT_SHA: ${{ steps.release.outputs.commit }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/check-images.sh "$RELEASE_VERSION" "$COMMIT_SHA"
          release_args=()
          if [ -n "$RELEASE_VERSION" ]; then
            if docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" >/dev/null 2>&1; then
              docker pull "$IMAGE:$RELEASE_TAG"
              revision=$(docker image inspect "$IMAGE:$RELEASE_TAG" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
              test "$revision" = "$COMMIT_SHA" || { echo "Version tag belongs to another source commit"; exit 1; }
              echo "This production image was already published; keep its immutable version tag."
              docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$RELEASE_TAG"
              exit 0
            fi
            release_args=(--tag "$IMAGE:$RELEASE_TAG" --build-arg "APP_RELEASE_VERSION=$RELEASE_VERSION" --build-arg "APP_RELEASE_ID=$RELEASE_VERSION:$COMMIT_SHA" --label "org.opencontainers.image.version=$RELEASE_VERSION")
          fi
          docker buildx build --platform linux/amd64,linux/arm64 --tag "$IMAGE:latest" --tag "$IMAGE:sha-$COMMIT_SHA" --label "org.opencontainers.image.revision=$COMMIT_SHA" "${release_args[@]}" --push .
      - name: Tag validated production version
        if: steps.release.outputs.eligible == 'true'
        run: |
          if git rev-parse "refs/tags/${{ steps.release.outputs.tag }}" >/dev/null 2>&1; then
            test "$(git rev-parse refs/tags/${{ steps.release.outputs.tag }})" = "${{ steps.release.outputs.commit }}"
          else
            git tag "${{ steps.release.outputs.tag }}" "${{ steps.release.outputs.commit }}"
          fi
          git push origin "refs/tags/${{ steps.release.outputs.tag }}"
      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.official_release == true && inputs.validation_only == false) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release V'))) && steps.release.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ steps.release.outputs.commit }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_VERSION.md" --latest
          else
            gh release create "$RELEASE_TAG" --verify-tag --target "$COMMIT_SHA" --title "$RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_VERSION.md" --latest
          fi
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG"
          test "$(docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --format '{{.Manifest.Digest}}')" = "$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')"
          docker buildx imagetools inspect --raw "$IMAGE:$RELEASE_TAG" > /tmp/links-release-manifest.json
          python3 -c 'import json; data=json.load(open("/tmp/links-release-manifest.json")); platforms={(m.get("platform",{}).get("os"),m.get("platform",{}).get("architecture")) for m in data["manifests"]}; assert {("linux","amd64"),("linux","arm64")} <= platforms, platforms'
          gh release upload "$RELEASE_TAG" /tmp/links-release-manifest.json --clobber
          gh release download "$RELEASE_TAG" --pattern links-release-manifest.json --dir /tmp/links-release-verification
          cmp /tmp/links-release-manifest.json /tmp/links-release-verification/links-release-manifest.json


