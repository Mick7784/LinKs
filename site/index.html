<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080f1b">
  <meta name="description" content="Retrouve DomotiK Studio : vidéos, domotique, tech et objets du quotidien. Tous mes liens au même endroit.">
  <title>DomotiK Studio — Tous mes liens</title>
  <link rel="icon" type="image/webp" href="assets/logo.webp">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="icons.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
  <script src="metrics.js" defer></script>
</head>
<body>
  <main>
    <header class="profile">
      <div class="portrait-wrap">
        <img class="portrait" id="profile-avatar" src="assets/portrait.webp" alt="Mickaël, créateur de DomotiK Studio" width="144" height="144" fetchpriority="high">
        <span class="logo-badge"><img id="profile-logo" src="assets/logo.webp" alt="Logo DK" width="40" height="40"></span>
      </div>
      <h1 id="profile-name">DomotiK Studio</h1>
      <p class="tagline" id="profile-tagline">La maison plus confortable.</p>
      <p class="topics" id="profile-description">Domotique • Tech • Objets du quotidien</p>
      <nav class="socials" aria-label="Mes réseaux" id="socials"></nav>
    </header>
    <section class="latest-video" id="latest-video" aria-label="Dernière vidéo" hidden></section>
    <nav class="links" aria-label="Tous mes liens" id="links"></nav>
    <noscript><p class="fallback">Active JavaScript pour afficher mes liens.</p></noscript>
    <footer><img id="footer-logo" src="assets/logo.webp" alt="" width="28" height="28"><p>© <span id="year">2026</span> <span id="footer-name">DomotiK Studio</span></p><p>Mesure d’audience agrégée, sans cookies : pages vues, provenance et clics. Aucun identifiant visiteur ni adresse IP conservé dans les statistiques. Conservation : 400 jours.</p></footer>
  </main>
</body>
</html>
