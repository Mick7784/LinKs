worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  limit_req_zone $binary_remote_addr zone=metrics:1m rate=30r/s;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /nginx-healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /healthz {
      access_log off;
      proxy_pass http://127.0.0.1:3003;
      proxy_connect_timeout 1s;
      proxy_read_timeout 2s;
    }
    location = /latest-video.json {
      proxy_pass http://127.0.0.1:3003;
      proxy_read_timeout 30s;
    }
    location = /metrics {
      access_log off;
      client_max_body_size 2k;
      limit_req zone=metrics burst=100 nodelay;
      proxy_pass http://127.0.0.1:3003;
      proxy_connect_timeout 1s;
      proxy_read_timeout 5s;
    }
    location /go/ {
      access_log off;
      proxy_pass http://127.0.0.1:3003;
      proxy_connect_timeout 1s;
      proxy_read_timeout 5s;
    }
    # Opaque nine-character short URLs at the domain root.
    # Reserved/static paths retain their existing routes and public assets.
    location ~ "^/[A-Za-z0-9_-]{9}$" {
      access_log off;
      proxy_pass http://127.0.0.1:3003;
      proxy_connect_timeout 1s;
      proxy_read_timeout 5s;
    }
    location = /public-fallback.json {
      alias /data/public-fallback.json;
      expires -1;
      default_type application/json;
    }
    # Server-to-server PulSe API: LinKs validates a dedicated long Bearer token.
    # Never expose the admin session, cookies or a general-purpose API proxy.
    location ^~ /api/pulse/ {
      proxy_pass http://127.0.0.1:8081;
      proxy_connect_timeout 2s;
      proxy_read_timeout 7s;
      client_max_body_size 2k;
      add_header Cache-Control "no-store" always;
    }
    location = /api/public-config {
      proxy_pass http://127.0.0.1:3003;
      proxy_connect_timeout 1s;
      proxy_read_timeout 5s;
    }
    location /assets/ {
      proxy_pass http://127.0.0.1:3003;
      proxy_connect_timeout 1s;
      proxy_read_timeout 5s;
    }
    location /uploads/ {
      proxy_pass http://127.0.0.1:3003;
      proxy_connect_timeout 1s;
      proxy_read_timeout 5s;
    }
    location / { try_files $uri $uri/ =404; expires -1; }
  }
}


