name: domotik-links
services:
  links:
    image: ghcr.io/mick7784/links:${IMAGE_TAG:-latest}
    environment:
      CREATOR_STUDIO_URL: http://creator-studio-api:3001/api/export/youtube
      CREATOR_STUDIO_API_KEY: ${CREATOR_STUDIO_API_KEY:-}
      STATS_PASSWORD: ${STATS_PASSWORD:?Set a password of at least 16 characters}
    volumes:
      - links-stats:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      pangolin:
        aliases:
          - domotik-links
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  pangolin:
    external: true

volumes:
  links-stats:
