name: links
services:
  links:
    image: ghcr.io/mick7784/links:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    environment:
      CREATOR_STUDIO_URL: ${CREATOR_STUDIO_URL:-}
      CREATOR_STUDIO_API_KEY: ${CREATOR_STUDIO_API_KEY:-}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-}
      DOMADOO_LOGIN: ${DOMADOO_LOGIN:-}
      DOMADOO_PASSWORD: ${DOMADOO_PASSWORD:-}
      AMAZON_LOGIN: ${AMAZON_LOGIN:-}
      AMAZON_PASSWORD: ${AMAZON_PASSWORD:-}
      AMAZON_MFA_SECRET: ${AMAZON_MFA_SECRET:-}
    volumes:
      - links-data:/data
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  links-data:
